[build-system]
requires = ["setuptools>=77", "wheel", "Cython>=3.1,<4"]
build-backend = "setuptools.build_meta"

[project]
name = "ouroborus"
version = "1.0.0"
description = "Birdcage cellular automata and the Worldish artificial life framework"
requires-python = ">=3.11"
dependencies = ["Cython>=3.1,<4", "setuptools>=77", "Pillow>=10"]

[project.optional-dependencies]
graphics = ["pygame>=2.6"]
desktop = ["PySide6>=6.10,<7", "pyte>=0.8.2,<0.9"]
audio = ["ctcsound>=6.17.1", "numpy>=1.26"]
test = ["pytest>=8"]

[project.scripts]
worldish = "worldish.start:main"
worldish-desktop = "worldish.desktop.app:main"

[tool.pytest.ini_options]
testpaths = ["tests", "birdcage/testtopology.py"]
